function vGrade(){const T=TURNOS[S.turno];let h=`<div class="row"><select onchange="S.turno=this.value;render()">${Object.entries(TURNOS).map(([k,v])=>`<option value="${k}" ${S.turno===k?'selected':''}>${v.n}</option>`).join('')}</select><select onchange="S.esp=this.value;render()">${Object.entries(ESP).map(([k,v])=>`<option value="${k}" ${S.esp===k?'selected':''}>${v}</option>`).join('')}</select>`;
if(S.user.perfil==='Professor')h+=`<label style="margin:0"><input type="checkbox" ${S.mine?'checked':''} onchange="S.mine=this.checked;render()"> só minhas aulas</label>`;
if(adm())h+=`<button class="p" onclick="gerar(1)">Gerar proposta automática</button><button onclick="if(confirm('Limpar toda a grade?')){S.aloc=[];save();render()}">Limpar</button>`;
h+=`</div><div class="card sc"><table><tr><th>Aula</th>${DIAS.map(d=>`<th>${d}</th>`).join('')}</tr>`;
T.h.forEach((hr,s)=>{h+=`<tr><th>${s+1}ª<br><small class="mt">${hr}</small></th>`;for(let d=0;d<5;d++){const a=S.aloc.find(x=>x.turno===S.turno&&x.esp===S.esp&&x.dia===d&&x.slot===s);if(a){const r=rq(a.req);const dim=S.mine&&r.prof!==S.user.nome;h+=`<td class="c ${r.pr?'pr':'n'} ${adm()?'e':''}" style="${dim?'opacity:.25;':''}--cc:${CI[r.curso][1]}" ${adm()?`onclick="rem(${a.req})"`:''}><b>${IC[r.curso]} ${r.turma}</b><small>${r.disc}</small><small>${r.prof}</small></td>`}else h+=`<td class="c ${adm()?'e':''}" ${adm()?`onclick="add(${d},${s})"`:''}></td>`}h+='</tr>'});
return h+`</table></div><p class="mt">Laranja = prioridade informática. ${adm()?'Clique numa célula vazia para alocar manualmente ou numa ocupada para remover.':''}</p>`}
function add(d,s){const e=S.esp,t=S.turno;const pend=S.reqs.filter(r=>r.turno===t&&!placed(r.id));const dl=document.getElementById('dlg');dl.innerHTML=`<h3>${ESP[e]} · ${DIAS[d]} · ${s+1}ª aula</h3>${pend.length?`<select id="pq" style="width:100%">${pend.map(r=>`<option value="${r.id}">${r.turma} · ${r.disc} · ${r.prof}</option>`).join('')}</select>`:'<p>Não há solicitações pendentes neste turno.</p>'}<p id="er" class="tag t-er" style="display:none"></p><div class="row" style="margin-top:12px"><button onclick="dlg.close()">Cancelar</button>${pend.length?'<button class="p" onclick="conf('+d+','+s+')">Alocar</button>':''}</div>`;dl.showModal()}
function conf(d,s){const r=rq(+pq.value);const c=conflito(r,S.esp,d,s);if(c){er.textContent=c;er.style.display='inline-block';return}S.aloc.push({req:r.id,esp:S.esp,dia:d,slot:s,turno:r.turno});save();dlg.close();render()}
function rem(id){const r=rq(id);if(confirm('Remover '+r.turma+' · '+r.disc+' desta grade?')){S.aloc=S.aloc.filter(a=>a.req!==id);save();render()}}
function vSol0(){const prof=S.user.perfil==='Professor';const list=prof?S.reqs.filter(r=>r.prof===S.user.nome):S.reqs;const turmas=[...new Set(S.reqs.map(r=>r.turma))];
let h='';if(prof)h+=`<div class="card"><b>Nova solicitação</b><div class="row" style="margin-top:8px"><select id="nt">${turmas.map(t=>`<option>${t}</option>`).join('')}</select><input id="nd" placeholder="Disciplina"><button class="p" onclick="nova()">Solicitar</button></div></div>`;
h+=`<div class="card sc"><table><tr><th>Turma</th><th>Disciplina</th><th>Professor</th><th>Situação</th></tr>${list.map(r=>{const a=placed(r.id);return `<tr><td>${IC[r.curso]} ${r.turma}${r.pr?' <span class="tag t-pr">prioridade</span>':''}</td><td>${r.disc}</td><td>${r.prof}</td><td>${a?`<span class="tag t-ok">${ESP[a.esp]} · ${DIAS[a.dia]} · ${a.slot+1}ª</span>`:'<span class="tag t-er">pendente</span>'}</td></tr>`}).join('')}</table></div>`;
if(adm())h+=`<button onclick="if(confirm('Restaurar dados de demonstração?')){S.reqs=gen();S.aloc=[];save();render()}">Restaurar dados de demonstração</button>`;return h}
function nova(){const d=nd.value.trim();if(!d)return;const t=S.reqs.find(r=>r.turma===nt.value);S.reqs.push({id:++uid,turma:t.turma,turno:t.turno,curso:t.curso,pr:t.pr,disc:d,prof:S.user.nome});save();render()}
function vPainel0(){let h='<div class="g">';for(const k of Object.keys(TURNOS)){const q=S.reqs.filter(r=>r.turno===k),al=S.aloc.filter(a=>a.turno===k).length,cap=4*30;
h+=`<div class="card"><b>${TURNOS[k].n}</b><p class="mt">${q.length} aulas solicitadas · ${cap} vagas (4 espaços × 30)</p><div class="bar"><i style="width:${Math.min(100,q.length/cap*100)}%"></i></div><p class="mt">Demanda: ${Math.round(q.length/cap*100)}% da capacidade</p><p>${al} alocadas · <span class="tag ${q.length-al?'t-er':'t-ok'}">${q.length-al} pendentes</span></p>`;
for(const e of Object.keys(ESP)){const n=S.aloc.filter(a=>a.turno===k&&a.esp===e).length;h+=`<div class="mt">${ESP[e]}: ${Math.round(n/30*100)}%</div><div class="bar"><i style="width:${n/30*100}%"></i></div>`}h+='</div>'}
h+='</div>';const p=S.reqs.filter(r=>!placed(r.id));h+=`<div class="card"><b>Conflitos / pendentes (${p.length})</b>${p.length?`<ul>${p.slice(0,30).map(r=>`<li>${r.turma} · ${r.disc} · ${r.prof}</li>`).join('')}</ul>`:'<p class="mt">Nenhuma pendência.</p>'}</div>`;return h}
S.user=null;S.pend=null;S.cas=0;applyTheme();
if(!S.aloc.length&&!S.demo){S.demo=1;gerar()}else render();
</script>
</body>
</html>
